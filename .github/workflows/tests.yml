# Checks the skills' structure, manifests, links and public-safety guards, and tests mw.py on the three operating
# systems on the oldest and newest Python supported, with ffmpeg from each system's own package manager (apt on
# Ubuntu, Homebrew on macOS, Chocolatey on Windows; no third-party action). The analyze job adds librosa so
# `mw.py analyze` runs for real; everywhere else it checks the soft failure and its fix line.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg (Ubuntu, apt)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: ffmpeg (macOS, Homebrew)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows, Chocolatey)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: ffmpeg is on PATH
        run: ffmpeg -hide_banner -version
      - name: skills, companions, manifests, links and text guards
        run: python tests/check_skills.py
      - name: mw.py tests
        env:
          MUSICWRIGHT_REQUIRE_FFMPEG: "1"
        run: python tests/test_mw.py
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: ffmpeg and librosa
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m pip install librosa soundfile
      - name: mw.py tests with librosa
        env:
          MUSICWRIGHT_REQUIRE_FFMPEG: "1"
          MUSICWRIGHT_REQUIRE_LIBROSA: "1"
        run: python tests/test_mw.py
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: size budget (red fails)
        run: python scripts/budget.py
