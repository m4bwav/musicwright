# Official releases. Push a tag `vX.Y.Z` (matching .claude-plugin/plugin.json and mw.py's VERSION) and this job runs
# the structure checks, the mw.py tests and the size budget, zips the skill folders and publishes them as a GitHub release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: version in plugin.json must match the tag
        run: |
          v=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "plugin.json says $v, tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: ffmpeg (static build; apt if the download fails)
        timeout-minutes: 10
        run: curl -fsSL --max-time 180 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz -o /tmp/ff.tar.xz && tar -xJf /tmp/ff.tar.xz -C /tmp && echo "$(ls -d /tmp/ffmpeg-n9.0-*/bin)" >> "$GITHUB_PATH" || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
      - name: structure checks, mw.py tests and size budget
        env:
          MUSICWRIGHT_REQUIRE_FFMPEG: "1"
        run: |
          python tests/check_skills.py
          python tests/test_mw.py
          python scripts/budget.py
      - name: pack the skills
        run: |
          mkdir dist
          python - <<'EOF'
          import os, zipfile
          v = os.environ["GITHUB_REF_NAME"].lstrip("v")
          with zipfile.ZipFile(f"dist/musicwright-{v}.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk("skills"):
                  dirs[:] = [d for d in dirs if d != "__pycache__"]
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, "."))
              for extra in ("README.md", "LICENSE", "SECURITY.md"):
                  z.write(extra, extra)
          EOF
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "musicwright ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Install: add this repository as a Claude Code marketplace, or unzip and link each folder under skills/ into your agent skills folder (~/.claude/skills, ~/.agents/skills, ~/.copilot/skills or .cursor/skills). The skills share musicwright/scripts, so install all seven together. mw.py needs ffmpeg on PATH. Reasoned changes: CHANGELOG.md and each skill CHANGELOG.md."
